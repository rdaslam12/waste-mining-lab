{% extends "home/pages/base_section.html" %}
{% load wagtailcore_tags %}

{% block section_content %}
<header class="compact-section-header">
    <h1 id="archive-title">Publication Index</h1>
</header>

<section class="archive-section" aria-labelledby="archive-title">
    <form class="archive-filters publication-filters" method="get" action="{{ page.url }}" role="search" aria-label="Search publications">
        <div class="filter-field filter-field--search">
            <label for="publication-search">Search the archive</label>
            <input id="publication-search" name="q" type="search" value="{{ query }}" placeholder="Title, author, journal or keyword" maxlength="200" autocomplete="off">
        </div>
        <div class="filter-field">
            <label for="publication-year">Year</label>
            <select id="publication-year" name="year">
                <option value="">All years</option>
                {% for year in years %}
                    <option value="{{ year }}" {% if selected_year == year|stringformat:"s" %}selected{% endif %}>{{ year }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="filter-field">
            <label for="publication-type">Type</label>
            <select id="publication-type" name="type">
                <option value="">All types</option>
                {% for val, lbl in publication_types %}
                    <option value="{{ val }}" {% if selected_type == val %}selected{% endif %}>{{ lbl }}</option>
                {% endfor %}
            </select>
        </div>
        <button class="editorial-button" type="submit">Filter</button>
        {% if query or selected_year or selected_type %}
            <a class="reset-link" href="{{ page.url }}">Clear filters</a>
        {% endif %}
    </form>

    <div class="publication-search-status" id="publication-search-status" aria-hidden="true"></div>

    {% include "home/includes/publications_results.html" %}
</section>
{% endblock %}
